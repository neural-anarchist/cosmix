<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <title>About Us — Cosmix</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/team.css" />
</head>
<body class="team-page">

  <header class="team-header">
    <a href="../" class="back-link">← Back to Cosmix</a>
    <h1>About Us</h1>
    <nav class="about-nav" aria-label="About sections">
      <a href="#about">About Cosmix</a>
      <a href="#team">Meet the Team</a>
      <a href="#club">Lexington Physics Club</a>
      <a href="#partners">Partners</a>

  <main class="about-main">
    <section id="about" class="about-section">
      <h2 class="section-title">About Cosmix</h2>
      <div id="about-text" class="about-text"></div>

    <section id="team" class="about-section">
      <h2 class="section-title">Meet the Team</h2>
      <p class="team-subtitle">The builders of Cosmix.</p>

      <ol id="club-schedule" class="schedule" tabindex="0" aria-label="Club schedule, scrollable"></ol>

    <section id="partners" class="about-section">
      <h2 class="section-title">Partners</h2>
      <div id="partner-grid" class="team-grid partner-grid"></div>

  <script type="module" src="../src/team.js"></script>
