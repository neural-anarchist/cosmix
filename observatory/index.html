<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The Cosmix Observatory — write-ups on physics models and derivations, one entry at a time." />
  <meta name="theme-color" content="#070b14" />
  <title>The Observatory — Cosmix</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Entries are markdown, rendered client-side. Without the network,
       raw markdown/LaTeX stays readable rather than breaking the page
       (see .katex-missing in subpages.css and the try/catch in
       observatory.js's per-entry fetch). -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.0/lib/marked.umd.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/lab.css" />
  <link rel="stylesheet" href="../assets/css/subpages.css" />
  <script type="module" src="../src/observatory.js"></script>
</head>

<body class="lab-page">

  <header class="lab-header">

    </p>

  <main id="observatory-main" class="subpage-main">

</html>
